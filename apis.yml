name: Heartbeat Health
description: 'Heartbeat Health is a New York-based modern cardiology practice delivering
  remote and virtual cardiovascular care. The company combines early detection, home-based
  cardiac diagnostics, remote patient monitoring, risk stratification and evidence-based
  care coordination to proactively identify, treat and manage moderate-to-high cardiovascular
  risk. It serves hospitals and health systems, payors and employer groups, providers
  and ACOs, and in-home care providers, reporting outcomes such as 90%+ of patients
  reaching target blood pressure and a 53% reduction in cardiac readmissions. Backed
  by Optum Ventures, DaVita Venture Group and Echo Health Ventures, it is a care-delivery
  organization rather than a public API provider; no developer portal, API documentation,
  or public API surface was found during enrichment.'
